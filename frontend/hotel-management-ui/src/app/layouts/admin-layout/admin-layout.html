<div class="min-h-screen bg-slate-100">
  <aside class="fixed inset-y-0 left-0 z-50 hidden w-72 border-r border-slate-200 bg-[#111827] text-white lg:block">
    <div class="flex h-full flex-col">
      <div class="border-b border-white/10 p-6">
        <div class="flex items-center gap-3">
          <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-[#c69c6d] text-lg font-black text-white">
            H
          </div>
          <div>
            <p class="text-lg font-black">Horizon Admin</p>
            <p class="text-xs text-white/50">Hotel Management</p>
          </div>
        </div>
      </div>

      <nav class="flex-1 space-y-2 p-4">
        <a
          routerLink="/admin"
          routerLinkActive="bg-white/10 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center rounded-2xl px-4 py-3 text-sm font-bold text-white/70 transition hover:bg-white/10 hover:text-white"
        >
          Dashboard
        </a>

        <a
          routerLink="/admin/rooms"
          routerLinkActive="bg-white/10 text-white"
          class="flex items-center rounded-2xl px-4 py-3 text-sm font-bold text-white/70 transition hover:bg-white/10 hover:text-white"
        >
          Quản lý phòng
        </a>

        <a
          routerLink="/admin/bookings"
          routerLinkActive="bg-white/10 text-white"
          class="flex items-center rounded-2xl px-4 py-3 text-sm font-bold text-white/70 transition hover:bg-white/10 hover:text-white"
        >
          Quản lý đặt phòng
        </a>

        <a
          routerLink="/"
          class="flex items-center rounded-2xl px-4 py-3 text-sm font-bold text-white/70 transition hover:bg-white/10 hover:text-white"
        >
          Xem website
        </a>
      </nav>

      <div class="border-t border-white/10 p-4">
        @if (authService.currentUser(); as user) {
          <div class="mb-4 rounded-2xl bg-white/10 p-4">
            <p class="text-sm font-black">{{ user.fullName }}</p>
            <p class="mt-1 text-xs text-white/50">{{ user.email }}</p>
          </div>
        }

        <button
          type="button"
          (click)="logout()"
          class="w-full rounded-2xl bg-red-500/10 px-4 py-3 text-sm font-black text-red-200 transition hover:bg-red-500/20"
        >
          Đăng xuất
        </button>
      </div>
    </div>
  </aside>

  <div class="lg:pl-72">
    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/80 px-6 py-4 backdrop-blur-xl">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm font-bold uppercase tracking-[0.2em] text-[#c69c6d]">Admin Panel</p>
          <h1 class="text-2xl font-black text-[#111827]">Quản trị khách sạn</h1>
        </div>

        <button
          type="button"
          (click)="logout()"
          class="rounded-full bg-[#111827] px-5 py-2.5 text-sm font-bold text-white lg:hidden"
        >
          Đăng xuất
        </button>
      </div>
    </header>

    <main class="p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
