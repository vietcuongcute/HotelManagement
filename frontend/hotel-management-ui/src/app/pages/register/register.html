<section class="relative flex min-h-[calc(100vh-80px)] items-center justify-center overflow-hidden px-6 py-12">
  <div class="absolute inset-0">
    <img
      src="https://images.unsplash.com/photo-1542314831-068cd1dbfeeb"
      alt="Hotel lobby"
      class="h-full w-full object-cover"
    />
    <div class="absolute inset-0 bg-[#111827]/70"></div>
  </div>

  <div class="relative w-full max-w-xl rounded-[2rem] bg-white p-8 shadow-2xl md:p-10">
    <p class="text-sm font-black uppercase tracking-[0.2em] text-[#c69c6d]">Create account</p>
    <h2 class="mt-3 text-4xl font-black text-[#1f2a44]">Đăng ký</h2>
    <p class="mt-2 text-sm text-slate-500">Tạo tài khoản để đặt phòng tại Horizon Hotel.</p>

    @if (errorMessage()) {
      <div class="mt-6 rounded-2xl border border-red-100 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">
        {{ errorMessage() }}
      </div>
    }

    <form class="mt-8 space-y-5" (ngSubmit)="submit()">
      <div>
        <label class="text-sm font-semibold text-slate-700">Họ tên</label>
        <input
          name="fullName"
          [(ngModel)]="fullName"
          class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 outline-none focus:border-[#c69c6d] focus:ring-4 focus:ring-[#c69c6d]/20"
          placeholder="Nguyễn Văn A"
        />
      </div>

      <div>
        <label class="text-sm font-semibold text-slate-700">Email</label>
        <input
          name="email"
          [(ngModel)]="email"
          type="email"
          class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 outline-none focus:border-[#c69c6d] focus:ring-4 focus:ring-[#c69c6d]/20"
          placeholder="you@email.com"
        />
      </div>

      <div>
        <label class="text-sm font-semibold text-slate-700">Mật khẩu</label>
        <input
          name="password"
          [(ngModel)]="password"
          type="password"
          class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 outline-none focus:border-[#c69c6d] focus:ring-4 focus:ring-[#c69c6d]/20"
          placeholder="Ít nhất 6 ký tự"
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full rounded-2xl bg-[#c69c6d] px-5 py-3 font-black text-white shadow-lg shadow-[#c69c6d]/30 transition hover:bg-[#b98958] disabled:cursor-not-allowed disabled:opacity-70"
      >
        @if (isLoading()) {
          Đang tạo tài khoản...
        } @else {
          Tạo tài khoản
        }
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Đã có tài khoản?
      <a routerLink="/login" class="font-bold text-[#c69c6d]">Đăng nhập</a>
    </p>
  </div>
</section>
