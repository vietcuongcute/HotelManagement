<section class="flex min-h-[calc(100vh-80px)] items-center justify-center px-6 py-12">
  <div class="w-full max-w-xl rounded-[2rem] bg-white p-8 shadow-2xl md:p-10">
    <p class="text-sm font-bold uppercase tracking-[0.2em] text-blue-600">Create account</p>
    <h1 class="mt-3 text-3xl font-black text-slate-950">Tạo tài khoản User</h1>
    <p class="mt-2 text-sm text-slate-500">Sau khi đăng ký, bạn có thể đặt phòng và xem lịch sử booking.</p>

    <form class="mt-8 space-y-5">
      <div>
        <label class="text-sm font-semibold text-slate-700">Họ tên</label>
        <input
          class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          placeholder="Nguyễn Văn A"
        />
      </div>

      <div>
        <label class="text-sm font-semibold text-slate-700">Email</label>
        <input
          type="email"
          class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          placeholder="you@email.com"
        />
      </div>

      <div>
        <label class="text-sm font-semibold text-slate-700">Mật khẩu</label>
        <input
          type="password"
          class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          placeholder="••••••••"
        />
      </div>

      <button
        type="button"
        class="w-full rounded-2xl bg-slate-950 px-5 py-3 font-bold text-white shadow-lg shadow-slate-950/20 hover:bg-slate-800"
      >
        Đăng ký
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Đã có tài khoản?
      <a routerLink="/login" class="font-bold text-blue-600">Đăng nhập</a>
    </p>
  </div>
</section>
